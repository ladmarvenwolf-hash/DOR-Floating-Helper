name: Build DOR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unpack project ZIP
        run: |
          run: |
          ls -la
          find . -name "DOR_Floating_Helper_Source.zip"
          find project -type f -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR="$(find . -name settings.gradle -type f -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find . -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "Не найден файл settings.gradle в ZIP"
            find . -maxdepth 3 -type f
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DOR-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
